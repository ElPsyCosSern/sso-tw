name: V3 Daily Signal

on:
  schedule:
    # Taiwan time 14:30 = UTC 06:30, after market close.
    - cron: "30 6 * * 1-5"
  workflow_dispatch:
    inputs:
      validate_only:
        description: "只驗證 FinMind 與 Google Sheets 讀取，不寫入資料"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: daily-signals-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-signal:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"

      - name: Install deps
        run: uv sync --frozen

      - name: Read-only credentials check
        if: github.event_name == 'workflow_dispatch' && inputs.validate_only
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_CREDS_JSON: ${{ secrets.GOOGLE_CREDS_JSON }}
        run: uv run python -m scripts.check_access

      - name: Run signal engine
        if: github.event_name != 'workflow_dispatch' || !inputs.validate_only
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_CREDS_JSON: ${{ secrets.GOOGLE_CREDS_JSON }}
        run: uv run python main.py
